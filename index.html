<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجمع كليوباترا الطبي</title>
<style>
:root{
  --primary:#0ea5a4; --primary-dark:#0b8685; --bg:#ffffff; --bg-alt:#f4fbfb;
  --text:#12232b; --text-soft:#5a6b72; --card:#ffffff; --border:#e3eef0;
  --wa:#25D366; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a1d; --bg-alt:#132226; --text:#eaf5f5; --text-soft:#a9bcc0; --card:#152528; --border:#213538;
}}
:root[data-theme="dark"]{
  --bg:#0f1a1d; --bg-alt:#132226; --text:#eaf5f5; --text-soft:#a9bcc0; --card:#152528; --border:#213538;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tahoma','Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--border);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;}
.brand{font-weight:800;font-size:1.2rem;color:var(--primary-dark);display:flex;gap:8px;align-items:center;}
.navlinks{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem;}
.navlinks a:hover{color:var(--primary);}
.btn{display:inline-block;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);}
.hero{background:linear-gradient(135deg,var(--bg-alt),var(--bg));padding:60px 0;text-align:center;}
.hero h1{font-size:2.1rem;margin-bottom:10px;}
.hero p{color:var(--text-soft);max-width:560px;margin:0 auto 24px;line-height:1.8;}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
section{padding:50px 0;}
h2.title{text-align:center;font-size:1.6rem;margin-bottom:8px;}
p.subtitle{text-align:center;color:var(--text-soft);margin-bottom:34px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .15s, box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.card .icon{font-size:1.8rem;margin-bottom:10px;}
#doctors-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
#doctors-grid .card{padding:16px 12px;cursor:pointer;}
#doctors-grid .card .icon{font-size:1.6rem;margin-bottom:6px;}
#doctors-grid .card h3{font-size:.9rem;margin:0 0 3px;}
#doctors-grid .card p{font-size:.78rem;}
@media(max-width:480px){
  .hero{padding:40px 0;}
  .hero h1{font-size:1.6rem;}
  section{padding:34px 0;}
  h2.title{font-size:1.3rem;}
  p.subtitle{margin-bottom:22px;}
