<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادة الأسنان</title>
<style>
:root{
  --primary:#0ea5a4; --primary-dark:#0b8685; --bg:#ffffff; --bg-alt:#f4fbfb;
  --text:#12232b; --text-soft:#5a6b72; --card:#ffffff; --border:#e3eef0;
  --wa:#25D366; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a1d; --bg-alt:#132226; --text:#eaf5f5; --text-soft:#a9bcc0; --card:#152528; --border:#213538;
}}
:root[data-theme="dark"]{
  --bg:#0f1a1d; --bg-alt:#132226; --text:#eaf5f5; --text-soft:#a9bcc0; --card:#152528; --border:#213538;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tahoma','Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--border);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;}
.brand{font-weight:800;font-size:1.2rem;color:var(--primary-dark);display:flex;gap:8px;align-items:center;}
.navlinks{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem;}
.navlinks a:hover{color:var(--primary);}
.btn{display:inline-block;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);}
.hero{background:linear-gradient(135deg,var(--bg-alt),var(--bg));padding:60px 0;text-align:center;}
.hero h1{font-size:2.1rem;margin-bottom:10px;}
.hero p{color:var(--text-soft);max-width:560px;margin:0 auto 24px;line-height:1.8;}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
section{padding:50px 0;}
h2.title{text-align:center;font-size:1.6rem;margin-bottom:8px;}
p.subtitle{text-align:center;color:var(--text-soft);margin-bottom:34px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}
.card .icon{font-size:1.8rem;margin-bottom:10px;}
.card h3{margin:0 0 6px;font-size:1.05rem;}
.card p{margin:0;color:var(--text-soft);font-size:.9rem;line-height:1.6;}
.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;}
@media(max-width:760px){.contact-grid{grid-template-columns:1fr;}}
.form-field{margin-bottom:14px;}
.form-field label{display:block;margin-bottom:6px;font-size:.88rem;color:var(--text-soft);}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem;}
.form-field textarea{min-height:80px;resize:vertical;}
.info-card{background:var(--bg-alt);border-radius:14px;padding:22px;border:1px solid var(--border);}
.info-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:.92rem;}
.info-row .ic{font-size:1.2rem;}
.divider{margin:18px 0;border:none;border-top:1px solid var(--border);}
footer{padding:26px 0;text-align:center;color:var(--text-soft);font-size:.85rem;border-top:1px solid var(--border);}
#msg-status{margin-top:10px;font-size:.88rem;}
.hidden{display:none !important;}
.dash-wrap{max-width:900px;margin:0 auto;padding:30px 20px;}
.dash-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.dash-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.9rem;}
.dash-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.msg-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.msg-item .top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-soft);margin-bottom:6px;flex-wrap:wrap;gap:6px;}
.msg-item h4{margin:0 0 4px;}
.badge{background:var(--primary);color:#fff;border-radius:6px;padding:2px 8px;font-size:.75rem;}
.wa-mini{color:var(--wa);font-weight:700;font-size:.85rem;}
.settings-form .form-field{max-width:420px;}
.floating-wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;background:var(--wa);color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">🦷 <span id="brand-name">عيادة الأسنان</span></div>
    <nav class="navlinks">
      <a href="#services">خدماتنا</a>
      <a href="#about">من نحن</a>
      <a href="#contact">تواصل معنا</a>
      <a href="#" id="dash-link" class="hidden">لوحة التحكم</a>
    </nav>
  </div>
</header>

<div id="site-view">
  <section class="hero">
    <div class="wrap">
      <h1>ابتسامتك أمانة في أيدينا</h1>
